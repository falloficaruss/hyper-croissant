name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: macos-latest
            target: x86_64-apple-darwin
          - platform: macos-latest
            target: aarch64-apple-darwin

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Install frontend dependencies
        working-directory: ui
        run: npm ci

      - name: Build frontend
        working-directory: ui
        run: npm run build

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Oropis ${{ github.ref_name }}'
          releaseBody: |
            ## Oropis ${{ github.ref_name }}

            AI-Powered Chess Intelligence — download for your platform below.

            ### What's Included
            - ✅ Stockfish 16.1 (pre-bundled)
            - ✅ Chess Intelligence Layer
            - ✅ AI Coach Mode
            - ✅ Eval Swing Explainer
            - ✅ "Why Not" Move Comparison
            - ✅ Game Library (SQLite-backed)
            - ✅ Multi-provider LLM support (OpenAI, Anthropic, Ollama)

            ### Installation
            See the [documentation](https://oropis.com/docs.html) for detailed installation instructions.
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}
          projectPath: ./src-tauri

  build-website:
    runs-on: ubuntu-latest
    needs: []
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install website dependencies
        working-directory: website
        run: npm ci

      - name: Build website
        working-directory: website
        run: npx vite build

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist
